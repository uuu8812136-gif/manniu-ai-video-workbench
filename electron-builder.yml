appId: com.aitool.desktop
productName: AI工具
asar: true
compression: normal

directories:
  output: dist

files:
  - out/**/*
  - package.json
  - "!**/*.map"
  - "!node_modules/better-sqlite3/build/**/*"
  - "!node_modules/better-sqlite3/deps/**/*"
  - "!node_modules/better-sqlite3/src/**/*"
  - "!node_modules/better-sqlite3/prebuilds/darwin-*.node"
  - "!node_modules/better-sqlite3/prebuilds/linux-*.node"
  - "!node_modules/better-sqlite3/prebuilds/linuxmusl-*.node"
  - "!node_modules/better-sqlite3/prebuilds/win32-arm64.node"

asarUnpack:
  - node_modules/better-sqlite3/prebuilds/win32-x64.node

extraResources:
  - from: vendor/claude
    to: claude
    filter:
      - "bin/claude.exe"
  - from: vendor/ffmpeg/win-x64
    to: ffmpeg
    filter:
      - "**/*"
  - from: vendor/python
    to: python
    filter:
      - "**/*"
  - from: vendor/inference-skill
    to: inference-skill
    filter:
      - "**/*"
      - "!**/__pycache__/**"
      - "!**/*.pyc"
  - from: vendor/opening-skill
    to: opening-skill
    filter:
      - "**/*"
      - "!**/__pycache__/**"
      - "!**/*.pyc"
  - from: vendor/hook-skill
    to: hook-skill
    filter:
      - "**/*"
      - "!**/__pycache__/**"
      - "!**/*.pyc"

electronLanguages:
  - zh-CN
  - en-US

npmRebuild: true
removePackageScripts: true
removePackageKeywords: true

electronDownload:
  mirror: https://cdn.npmmirror.com/binaries/electron/
electronDist: node_modules/electron/dist

win:
  executableName: ai-tool
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64

nsis:
  artifactName: ai-tool-setup-${version}-${arch}.${ext}
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  deleteAppDataOnUninstall: false
  runAfterFinish: true

portable:
  artifactName: ai-tool-portable-${version}-${arch}.${ext}
